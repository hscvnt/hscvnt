<rect x="4" y="4" width="792" height="532" rx="14" fill="none" stroke="#ff7a7a" stroke-width="7" stroke-linecap="round" opacity="0.5" filter="url(#beamBlur)" stroke-dasharray="210 2623"><animate attributeName="stroke-dashoffset" from="0" to="-2833" dur="7s" repeatCount="indefinite"/></rect>
