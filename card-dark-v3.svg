<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="ConsolasFallback,Consolas,monospace" width="800px" height="540px" font-size="16px">
<style>
@font-face {
src: local('Consolas'), local('Consolas Bold');
font-family: 'ConsolasFallback';
font-display: swap;
-webkit-size-adjust: 109%;
size-adjust: 109%;
}
text, tspan {white-space: pre;}
@font-face {
font-family: 'Unbounded';
font-weight: 900;
font-style: normal;
src: url(data:font/woff2;base64,) format('woff2');
}
.site  {font-family: Unbounded, ConsolasFallback, sans-serif; font-weight: 900; fill: #ffb3b3;}
.mail  {font-family: Unbounded, ConsolasFallback, sans-serif; font-weight: 900; fill: #c08a8a;}
.handle{font-family: Unbounded, ConsolasFallback, sans-serif; font-weight: 900; fill: #c08a8a;}
.cap   {font-family: Unbounded, ConsolasFallback, sans-serif; font-weight: 900; fill: #c08a8a; letter-spacing: 2px; opacity: 0.8;}
</style>
<defs>
<linearGradient id="art" x1="0" y1="60" x2="0" y2="480" gradientUnits="userSpaceOnUse">
<stop stop-color="#ffb3b3"/>
<stop offset="1" stop-color="#e05252"/>
</linearGradient>
<linearGradient id="logo_bg" x1="150" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
<stop stop-color="#FFA7A7"/><stop offset="1" stop-color="#996464"/>
</linearGradient>
<linearGradient id="logo_tl" x1="150" y1="150" x2="50" y2="50" gradientUnits="userSpaceOnUse">
<stop stop-color="#A90000"/><stop offset="1" stop-color="#430000"/>
</linearGradient>
<linearGradient id="logo_bl" x1="150" y1="150" x2="50" y2="250" gradientUnits="userSpaceOnUse">
